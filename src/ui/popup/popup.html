<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F95 Update Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="header-title">
        <span class="logo-text">F95 Tracker</span>
        <span id="badge-count" class="badge-count" style="display: none;">0</span>
      </div>
      <div class="header-actions">
        <button id="btn-check-now" class="btn btn-secondary" title="Check for updates now">Check Now</button>
        <button id="btn-open-library" class="btn btn-icon" title="Open Library / Settings">⚙️</button>
      </div>
    </header>

    <div id="popup-paused-alert" class="popup-paused-alert" style="display: none;"></div>

    <div class="search-bar">
      <input type="text" id="popup-search" placeholder="Filter games..." />
    </div>

    <main id="game-list" class="game-list">
      <div id="loading" class="empty-state">Loading tracked games...</div>
    </main>

    <footer class="footer">
      <span id="footer-stats">Tracking 0 games</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
