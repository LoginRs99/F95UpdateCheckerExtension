name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build distributions
        run: node scripts/build.js

      - name: Run verification checks
        run: |
          node scripts/check-syntax.js
          node --test test/*.test.js

      - name: Package extension artifacts
        run: |
          TAG="${{ github.ref_name }}"
          CHROMIUM_ZIP="f95-update-tracker-chromium-${TAG}.zip"
          FIREFOX_ZIP="f95-update-tracker-firefox-${TAG}.zip"

          (cd dist/chromium && zip -r "../../$CHROMIUM_ZIP" manifest.json icons/ src/)
          (cd dist/firefox && zip -r "../../$FIREFOX_ZIP" manifest.json icons/ src/)

          echo "=== Verifying Chromium zip contents ==="
          unzip -l "$CHROMIUM_ZIP"
          if unzip -l "$CHROMIUM_ZIP" | grep -E "node_modules|tests/|test/|fixtures/|\.github|\.git"; then
            echo "ERROR: Forbidden files found in Chromium zip artifact!"
            exit 1
          fi

          echo "=== Verifying Firefox zip contents ==="
          unzip -l "$FIREFOX_ZIP"
          if unzip -l "$FIREFOX_ZIP" | grep -E "node_modules|tests/|test/|fixtures/|\.github|\.git"; then
            echo "ERROR: Forbidden files found in Firefox zip artifact!"
            exit 1
          fi

          echo "Zip packages strictly verified: zero dev files present."
          echo "CHROMIUM_ZIP=$CHROMIUM_ZIP" >> $GITHUB_ENV
          echo "FIREFOX_ZIP=$FIREFOX_ZIP" >> $GITHUB_ENV

      - name: Sign Firefox extension with AMO (Unlisted)
        if: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npm ci || npm install
          npx web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir web-ext-artifacts \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --channel=unlisted

          SIGNED_XPI=$(find web-ext-artifacts -name "*.xpi" 2>/dev/null | head -n 1)
          if [ -n "$SIGNED_XPI" ]; then
            echo "SIGNED_XPI=$SIGNED_XPI" >> $GITHUB_ENV
            echo "Successfully signed Firefox extension: $SIGNED_XPI"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FILES=("$CHROMIUM_ZIP" "$FIREFOX_ZIP")
          if [ -n "$SIGNED_XPI" ] && [ -f "$SIGNED_XPI" ]; then
            RELEASE_FILES+=("$SIGNED_XPI")
          fi

          gh release create "${{ github.ref_name }}" "${RELEASE_FILES[@]}" \
            --title "f95-update-tracker ${{ github.ref_name }}" \
            --generate-notes
